version: "3.9"

services:
  # FastAPI backend
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: malvisionnet-api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - malvisionnet

  # Next.js frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: malvisionnet-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    restart: unless-stopped
    networks:
      - malvisionnet

networks:
  malvisionnet:
    driver: bridge

volumes:
  artifacts: